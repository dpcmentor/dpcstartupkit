# GitHub Actions workflow to check for broken links in the documentation.
#
# Runs in two modes:
#   1. On every pull request — catches new broken links before merge.
#   2. Weekly on a schedule — catches external links that rot over time
#      (a state medical board moves a page, a bootstrapping blog shuts down,
#      etc.). If a scheduled run finds problems, it opens a tracking issue.
#
# Uses lychee (https://github.com/lycheeverse/lychee), a fast and reliable
# link checker with built-in retry, caching, and a GitHub Action wrapper.

name: Link Check

on:
  pull_request:
    branches:
      - main
  schedule:
    # Every Monday at 12:00 UTC
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Check all markdown files in the repo. Be forgiving of transient
          # errors: retry twice and treat 429 / 403 as warnings (common for
          # rate-limited or bot-blocking sites). Mail links are excluded
          # by default (lychee's --include-mail defaults to false).
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 7d
            --max-retries 2
            --accept 200,204,206,429,403
            './**/*.md'
          # Fail the job if broken links are found (only matters on PRs;
          # scheduled runs still create an issue via the next step).
          fail: true

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Weekly link check found broken links
          content-filepath: ./lychee/out.md
          labels: |
            documentation
            link-rot
            automated
