# MkDocs configuration for DPC Startup Kit
# GitHub Pages: https://dpcmentor.github.io/dpcstartupkit/

site_name: DPC Startup Kit
site_description: A comprehensive resource collection for physicians launching Direct Primary Care practices
site_author: DPC Physicians
site_url: https://dpcmentor.github.io/dpcstartupkit/

# Repository
repo_name: dpcmentor/dpcstartupkit
repo_url: https://github.com/dpcmentor/dpcstartupkit
edit_uri: edit/main/docs/

# Copyright
copyright: >
  <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a> —
  Built by DPC physicians, for DPC physicians. Independent: nothing to sell.
  <a href="https://dpcmentor.github.io/dpcstartupkit/about-this-kit/">About this kit</a> ·
  <a href="https://github.com/dpcmentor/dpcstartupkit">Source</a>

# Theme configuration
theme:
  name: material
  custom_dir: overrides

  # Logo and favicon (placeholder paths - replace when assets available)
  logo: assets/logo-placeholder.svg
  favicon: assets/favicon.svg

  # Color palette with dark mode preference
  palette:
    # Dark mode (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  # Features
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - toc.follow

  # Custom fonts
  font:
    text: Sora
    code: JetBrains Mono

  # Icons
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: false
      exclude:
        - index.md

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra configuration
extra:
  social:
    - icon: fontawesome/solid/house-medical
      link: https://dpcmentor.com
      name: DPC Mentor Platform
    - icon: fontawesome/brands/github
      link: https://github.com/dpcmentor/dpcstartupkit
      name: GitHub

  # Analytics (uncomment and configure when ready)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

  generator: false

# Custom CSS
extra_css:
  - stylesheets/extra.css
  - assets/stylesheets/custom.css
  - assets/stylesheets/checklists.css

# Custom JavaScript
extra_javascript:
  - assets/javascripts/checklists.js

